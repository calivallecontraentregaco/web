<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro ERP</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 0 auto; padding: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    button { background: #0066cc; color: white; border: none; padding: 10px 15px; cursor: pointer; }
    #alert { margin: 15px 0; padding: 10px; border-radius: 4px; display: none; }
    .success { background: #d4edda; }
    .error { background: #f8d7da; }
  </style>
</head>
<body>
  <h1>Registro ERP</h1>
  <div id="alert"></div>
  <form id="registerForm">
    <div class="form-group">
      <label for="nombre_comercial">Nombre comercial*</label>
      <input type="text" id="nombre_comercial" required>
    </div>
    <div class="form-group">
      <label for="email">Correo electrónico*</label>
      <input type="email" id="email" required>
    </div>
    <div class="form-group">
      <label for="celular">Celular*</label>
      <input type="tel" id="celular" required>
    </div>
    <button type="submit">Enviar</button>
  </form>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      const alert = document.getElementById('alert')
      
      try {
        const response = await fetch('https://registro-calivalle.jcpm19991118.workers.dev/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre_comercial: document.getElementById('nombre_comercial').value,
            email: document.getElementById('email').value,
            celular: document.getElementById('celular').value
          })
        })

        const result = await response.json()
        
        if (response.ok) {
          showAlert('Registro exitoso', 'success')
        } else {
          throw new Error(result.error || 'Error desconocido')
        }
      } catch (error) {
        showAlert(`Error: ${error.message}`, 'error')
      }
    })

    function showAlert(message, type) {
      const alert = document.getElementById('alert')
      alert.textContent = message
      alert.className = type
      alert.style.display = 'block'
      setTimeout(() => alert.style.display = 'none', 5000)
    }
  </script>
</body>
</html>
