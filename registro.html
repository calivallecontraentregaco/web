<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro ERP</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { background: #f7f7f7; font-family: Arial, sans-serif; }
    .container { max-width: 600px; margin: 40px auto; background: #fff; padding: 24px 20px; border-radius: 8px; box-shadow: 0 3px 12px rgba(0,0,0,0.07);}
    h2 { text-align: center; }
    .form-group { margin-bottom: 16px; }
    label { display: block; margin-bottom: 6px; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; }
    button { background: #3498db; color: #fff; border: none; padding: 12px; width: 100%; border-radius: 4px; font-size: 16px; cursor: pointer;}
    button:disabled { background: #bdc3c7;}
    .alert { display: none; margin: 10px 0; padding: 10px; border-radius: 4px; }
    .alert.success { background: #d4edda; color: #155724; }
    .alert.error { background: #f8d7da; color: #721c24; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Registro ERP</h2>
    <div id="alert" class="alert"></div>
    <form id="registerForm" action="https://c.tuworker.workers.dev/" method="POST">
      <h3>Información de la Empresa</h3>
      <div class="form-group">
        <label for="nombre_comercial">Nombre comercial*</label>
        <input type="text" required name="nombre_comercial" id="nombre_comercial">
      </div>
      <div class="form-group">
        <label for="direccion">Dirección*</label>
        <input type="text" required name="direccion" id="direccion">
      </div>
      <div class="form-group">
        <label for="telefono">Teléfono*</label>
        <input type="tel" required name="telefono" id="telefono">
      </div>
      <h3>Representante Legal</h3>
      <div class="form-group">
        <label for="nombres_completos">Nombres completos*</label>
        <input type="text" required name="nombres_completos" id="nombres_completos">
      </div>
      <div class="form-group">
        <label for="email">Correo electrónico*</label>
        <input type="email" required name="email" id="email">
      </div>
      <div class="form-group">
        <label for="celular">Celular/WhatsApp*</label>
        <input type="tel" required name="celular" id="celular">
      </div>
      <div class="form-group">
        <label for="tipo_identificacion">Tipo de identificación*</label>
        <select id="tipo_identificacion" name="tipo_identificacion" required>
          <option value="">Seleccione...</option>
          <option value="NIT">NIT</option>
          <option value="CC">Cédula de ciudadanía</option>
          <option value="CE">Cédula de extranjería</option>
          <option value="PAS">Pasaporte</option>
        </select>
      </div>
      <div class="form-group">
        <label for="numero_identificacion">Número de identificación*</label>
        <input type="text" required name="numero_identificacion" id="numero_identificacion">
      </div>
      <button type="submit">Registrarse</button>
    </form>
  </div>
  <script>
    const form = document.getElementById('registerForm');
    const alertBox = document.getElementById('alert');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      alertBox.style.display = 'none';
      alertBox.textContent = '';
      alertBox.className = 'alert';
      const formData = new FormData(form);
      const data = Object.fromEntries(formData.entries());
      form.querySelector('button').disabled = true;
      try {
        const res = await fetch(form.action, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });
        const json = await res.json();
        if (res.ok && json.success) {
          alertBox.textContent = '¡Registro enviado correctamente!';
          alertBox.classList.add('success');
          form.reset();
        } else {
          alertBox.textContent = json.error || 'Error al enviar, inténtalo más tarde.';
          alertBox.classList.add('error');
        }
      } catch (err) {
        alertBox.textContent = 'Error de conexión. Inténtalo más tarde.';
        alertBox.classList.add('error');
      }
      alertBox.style.display = 'block';
      form.querySelector('button').disabled = false;
    });
  </script>
</body>
</html>
