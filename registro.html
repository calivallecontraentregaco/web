<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro ERP</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        body {
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .btn {
            background: #3498db;
            color: white;
            border: none;
            padding: 12px;
            width: 100%;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        .btn:hover {
            background: #2980b9;
        }
        .alert {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            display: none;
        }
        .success {
            background: #d4edda;
            color: #155724;
        }
        .error {
            background: #f8d7da;
            color: #721c24;
        }
        @media (max-width: 600px) {
            .container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Registro ERP</h1>
        
        <div id="alert" class="alert" style="display: none;"></div>
        
        <!-- Cambia "tucorreo@tudominio.com" por el correo destino configurado en Cloudflare Email Routing -->
        <form id="registerForm" action="mailto:calivalle@contraentregaco.com" method="POST" enctype="text/plain">
            <h2>Información de la Empresa</h2>
            
            <div class="form-group">
                <label for="companyName">Nombre comercial*</label>
                <input type="text" id="companyName" name="nombre_comercial" required>
            </div>
            
            <div class="form-group">
                <label for="companyAddress">Dirección*</label>
                <input type="text" id="companyAddress" name="direccion" required>
            </div>
            
            <div class="form-group">
                <label for="companyPhone">Teléfono*</label>
                <input type="tel" id="companyPhone" name="telefono" required>
            </div>
            
            <h2>Representante Legal</h2>
            
            <div class="form-group">
                <label for="fullName">Nombres completos*</label>
                <input type="text" id="fullName" name="nombres_completos" required>
            </div>
            
            <div class="form-group">
                <label for="email">Correo electrónico*</label>
                <input type="email" id="email" name="email" required>
            </div>
            
            <div class="form-group">
                <label for="phone">Celular/WhatsApp*</label>
                <input type="tel" id="phone" name="celular" required>
            </div>
            
            <div class="form-group">
                <label for="idType">Tipo de identificación*</label>
                <select id="idType" name="tipo_identificacion" required>
                    <option value="">Seleccione...</option>
                    <option value="NIT">NIT</option>
                    <option value="CC">Cédula de ciudadanía</option>
                    <option value="CE">Cédula de extranjería</option>
                    <option value="PAS">Pasaporte</option>
                </select>
            </div>
            
            <div class="form-group">
                <label for="idNumber">Número de identificación*</label>
                <input type="text" id="idNumber" name="numero_identificacion" required>
            </div>
            
            <!-- Campo oculto para redirección (no es compatible con mailto, solo webservices) -->
            <!-- <input type="hidden" name="_next" value="https://tudominio.com/gracias.html"> -->
            
            <!-- Para recibir copia al usuario (no es compatible con mailto) -->
            <!-- <input type="hidden" name="_cc" value="{email}"> -->
            
            <button type="submit" class="btn">Registrarse</button>
        </form>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            const btn = this.querySelector('button');
            btn.disabled = true;
            btn.textContent = 'Enviando...';
            
            // Mostrar mensaje de éxito aunque el envío real lo maneja el cliente de correo
            setTimeout(() => {
                const alertBox = document.getElementById('alert');
                alertBox.textContent = 'Registro enviado con éxito. Te contactaremos pronto.';
                alertBox.className = 'alert success';
                alertBox.style.display = 'block';
                btn.disabled = false;
                btn.textContent = 'Registrarse';
            }, 1500);
        });
    </script>
</body>
</html>
