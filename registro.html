<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro ERP | Tu Empresa</title>
  <meta name="description" content="Formulario de registro para acceder al ERP">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body { font-family: Arial, sans-serif; background: #f7f7f7; margin: 0; padding: 0; color: #222; }
    .container { max-width: 500px; margin: 40px auto; background: #fff; padding: 28px 20px; border-radius: 10px; box-shadow: 0 3px 18px rgba(0,0,0,0.08); }
    h1 { text-align: center; font-size: 2rem; margin-bottom: 6px; }
    h2 { text-align: center; font-size: 1.18rem; color: #555; font-weight: 400; margin-top: 0; margin-bottom: 24px; }
    .form-group { margin-bottom: 14px; }
    label { display: block; margin-bottom: 5px; font-size: 1rem; }
    input, select { width: 100%; padding: 9px 7px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; background: #fafbfc; }
    button { background: #2d7ecb; color: #fff; border: none; padding: 13px; width: 100%; border-radius: 4px; font-size: 1.12rem; cursor: pointer; margin-top: 7px; }
    .alert { display: none; margin: 10px 0; padding: 10px; border-radius: 4px; }
    .alert.success { background: #d4edda; color: #155724; }
    .alert.error { background: #f8d7da; color: #721c24; }
    @media (max-width: 600px) {
      .container { max-width: 97vw; padding: 16px 5vw; }
      h1 { font-size: 1.45rem; }
      h2 { font-size: 1rem; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Registro ERP</h1>
    <h2>Completa el formulario para acceder al sistema</h2>
    <div id="alert" class="alert"></div>
    <form id="registerForm">
      <div class="form-group">
        <label for="nombre_comercial">Nombre comercial*</label>
        <input type="text" id="nombre_comercial" required>
      </div>
      <div class="form-group">
        <label for="direccion">Dirección*</label>
        <input type="text" id="direccion" required>
      </div>
      <div class="form-group">
        <label for="telefono">Teléfono*</label>
        <input type="tel" id="telefono" required>
      </div>
      <div class="form-group">
        <label for="nombres_completos">Nombres completos*</label>
        <input type="text" id="nombres_completos" required>
      </div>
      <div class="form-group">
        <label for="email">Correo electrónico*</label>
        <input type="email" id="email" required>
      </div>
      <div class="form-group">
        <label for="celular">Celular*</label>
        <input type="tel" id="celular" required>
      </div>
      <div class="form-group">
        <label for="tipo_identificacion">Tipo de ID*</label>
        <select id="tipo_identificacion" required>
          <option value="">Seleccione...</option>
          <option value="NIT">NIT</option>
          <option value="CC">Cédula</option>
        </select>
      </div>
      <div class="form-group">
        <label for="numero_identificacion">Número de ID*</label>
        <input type="text" id="numero_identificacion" required>
      </div>
      <button type="submit">Registrarse</button>
    </form>
  </main>

  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault()
      const alert = document.getElementById('alert')
      
      try {
        const response = await fetch('https://tu-worker.tu-usuario.workers.dev/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            nombre_comercial: document.getElementById('nombre_comercial').value,
            direccion: document.getElementById('direccion').value,
            telefono: document.getElementById('telefono').value,
            nombres_completos: document.getElementById('nombres_completos').value,
            email: document.getElementById('email').value,
            celular: document.getElementById('celular').value,
            tipo_identificacion: document.getElementById('tipo_identificacion').value,
            numero_identificacion: document.getElementById('numero_identificacion').value
          })
        })

        const result = await response.json()
        showAlert(response.ok ? result.message : result.error, response.ok ? 'success' : 'error')
        if (response.ok) document.getElementById('registerForm').reset()
      } catch (error) {
        showAlert('Error de conexión', 'error')
      }
    })

    function showAlert(message, type) {
      const alert = document.getElementById('alert')
      alert.textContent = message
      alert.className = `alert ${type}`
      alert.style.display = 'block'
      setTimeout(() => alert.style.display = 'none', 5000)
    }
  </script>
</body>
</html>
